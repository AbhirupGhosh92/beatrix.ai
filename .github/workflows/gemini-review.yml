name: Gemini AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write # Required for WIF authentication

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/838350846959/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-gemini-reviewer@asterion-453905.iam.gserviceaccount.com'

      - name: Fetch PR Diff
        id: get_diff
        run: |
          git diff origin/${{ github.base_ref }}...origin/${{ github.head_ref }} > pr_diff.txt
          echo "diff_path=pr_diff.txt" >> $GITHUB_OUTPUT

      - name: Run Gemini Review
        id: gemini_review
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync('pr_diff.txt', 'utf8');

            if (diff.trim().length === 0) {
              console.log("No code changes detected.");
              return;
            }

            // Construct Vertex AI API call
            const projectId = 'asterion-453905';
            const location = 'us-central1';
            const model = 'gemini-1.5-pro';
            const url = `https://${location}-aiplatform.googleapis.com/v1/projects/${projectId}/locations/${location}/publishers/google/models/${model}:generateContent`;

            // Prompt engineering for code review
            const prompt = `You are an expert software engineer and security auditor. Review the following code diff for bugs, performance issues, security vulnerabilities, and code quality. Provide constructive feedback directly pointing to specific issues, and suggest concrete fixes.\n\nCode Diff:\n${diff}`;

            // Make the authenticated request using token from auth step
            const gcpToken = process.env.GOOGLE_OAUTH_ACCESS_TOKEN;
            const response = await fetch(url, {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${gcpToken}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }]
              })
            });

            const data = await response.json();
            const reviewText = data.candidates[0].content.parts[0].text;

            // Comment on the pull request
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### 🤖 Gemini Code Review Summary\n\n${reviewText}`
            });
