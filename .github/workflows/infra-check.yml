name: Infrastructure Validation

on:
  push:
    branches: [ main ]
    paths:
      - 'terraform/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'apphosting.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - 'terraform/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'apphosting.yaml'

permissions:
  contents: read

jobs:
  validate-infra:
    name: Validate Infrastructure Code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.8

      - name: Terraform Format Check
        run: terraform -chdir=terraform fmt -check

      - name: Terraform Init & Validate
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate

      - name: Run Infrastructure Sync Check
        run: bash scripts/check-infra.sh

      - name: Deployment scripts and plan guard
        run: bash scripts/check-scripts.sh

      # Every third-party action must be pinned to a full commit SHA so a moved tag cannot change
      # what runs with our cloud credentials. Dependabot keeps the pins current.
      - name: Actions are pinned to commit SHAs
        run: |
          bad="$(grep -rnE '^\s*-?\s*uses:\s*[^./ ]+/[^ ]+@' .github/workflows | grep -vE '@[0-9a-f]{40}(\s|$)' || true)"
          if [[ -n "$bad" ]]; then
            echo "::error::Pin these actions to a full commit SHA:"
            echo "$bad"
            exit 1
          fi

      - name: No force flags in the deployment pipeline
        run: |
          # --force is only allowed behind --allow-destructive in scripts/deploy-backend.sh and for
          # the artifact cleanup policy; -auto-approve is only allowed for the local bootstrap.
          if grep -rnE 'auto-approve' .github/workflows --exclude=infra-check.yml; then
            echo "::error::-auto-approve is not allowed in workflows; apply the reviewed, saved plan."
            exit 1
          fi
          if grep -rnE '(firebase|npx).*deploy.*--force' .github/workflows scripts/deploy-backend.sh --exclude=infra-check.yml | grep -v 'DEPLOY_FLAGS'; then
            echo "::error::Do not call 'firebase deploy --force' directly; use scripts/deploy-backend.sh --allow-destructive."
            exit 1
          fi
