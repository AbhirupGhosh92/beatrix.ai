name: Deploy

# Every push to main deploys dev, then staging (once dev succeeded). Prod is never deployed
# automatically: run this workflow by hand ("Run workflow"), choose `prod`, a release ref
# (release/<major.minor[.patch]> or v<major.minor.patch>) and type `prod` in `confirm`. Any
# environment can be redeployed the same way.
#
# The pipeline (verify -> plan -> guard -> approve (prod) -> backup -> apply -> selective
# component deploy -> smoke test) lives in deploy-environment.yml and is described step by step
# in docs/DEPLOYMENT.md, including the one-time GitHub setup (environments, reviewers).
#
# Each GitHub environment (dev, staging, prod) is set up by
# `./scripts/recreate-environment.sh <env>`; until then dev/staging jobs are skipped with a notice.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, staging, prod]
        default: dev
        required: true
      ref:
        description: Branch, tag or commit SHA to deploy (prod needs release/x.y[.z] or vX.Y.Z)
        type: string
        default: main
        required: true
      confirm:
        description: "Type the environment name again to confirm (required for prod)"
        type: string
        default: ""
      allow_destructive:
        description: "DANGEROUS: allow deleting/replacing protected resources and removed functions"
        type: boolean
        default: false
      redeploy_all:
        description: Redeploy every component even if its sources did not change
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dev:
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: dev
      ref: ${{ github.sha }}
      allow_destructive: false
      redeploy_all: false

  staging:
    if: github.event_name == 'push'
    needs: dev
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging
      ref: ${{ github.sha }}
      allow_destructive: false
      redeploy_all: false

  manual:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: ${{ inputs.environment }}
      ref: ${{ inputs.ref }}
      confirm: ${{ inputs.confirm }}
      allow_destructive: ${{ inputs.allow_destructive }}
      redeploy_all: ${{ inputs.redeploy_all }}
