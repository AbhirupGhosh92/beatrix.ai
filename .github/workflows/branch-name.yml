name: Branch name check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          pattern='^((feature|bug|spike|hotfix)/([0-9]+-)?[a-z0-9]+(-[a-z0-9]+)*|release/[0-9]+\.[0-9]+(\.[0-9]+)?|dependabot/[A-Za-z0-9._/-]+)$'
          if [[ ! "$HEAD_REF" =~ $pattern ]]; then
            echo "::error::Branch '$HEAD_REF' must match <feature|bug|spike|hotfix>/<issue-id>-<summary> or release/<major.minor[.patch]>"
            exit 1
          fi
