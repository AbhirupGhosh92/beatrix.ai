name: Deploy environment

# Reusable: the full, reviewed deployment of ONE environment. Called by deploy.yml.
# Full description, guarantees and runbooks: docs/DEPLOYMENT.md
#
#   policy   no cloud access: environment, ref and prod rules
#   gate     is the environment provisioned? skipped (dev) or failed (prod) before any build
#   verify   no cloud access: typecheck, lint, build, terraform validate, script tests
#   plan     terraform plan -> saved privately; plan guard blocks destroy/replace of stateful
#            resources; decides which components changed and publishes that decision table
#   approve  prod only: required reviewers of the `prod-release` GitHub environment approve,
#            seeing the same decision table
#   apply    snapshot CMS files (only if something will change) -> apply the SAVED plan -> deploy
#            only the components the plan job marked changed -> smoke test
#
# Every step prints its inputs, what it decided and why, and its result (scripts/deploy/log.sh
# format: [step] [info] [decision] [result]); steps are folded into log groups.
#
# Authenticates with Workload Identity Federation (no keys): the GitHub environment's variables
# GCP_PROJECT_ID, GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOYER_SERVICE_ACCOUNT and
# TF_STATE_BUCKET are written by scripts/sync-github-env.sh.
#
# Security notes: third-party actions are pinned to full commit SHAs; user-controlled values
# (ref, confirm) reach shell only through env variables, never through ${{ }} in a script;
# every job declares the least permissions it needs.

on:
  workflow_call:
    inputs:
      environment:
        description: dev | prod
        type: string
        required: true
      ref:
        description: Branch, tag or commit SHA to deploy
        type: string
        required: true
      confirm:
        description: Must equal the environment name when deploying prod
        type: string
        required: false
        default: ''
      allow_destructive:
        description: Allow the plan to delete/replace protected resources and removed functions to be deleted
        type: boolean
        required: false
        default: false
      redeploy_all:
        description: Redeploy every component even if its sources did not change
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# One deployment per environment at a time. A queued run waits; it never cancels a running one.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: 1.15.8
  FIREBASE_TOOLS_VERSION: 15.34.2
  NODE_VERSION: 22
  PNPM_VERSION: 11

jobs:
  # ----------------------------------------------------------------------------
  # 0. Policy: no checkout, no environment, no credentials
  # ----------------------------------------------------------------------------
  policy:
    name: Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the deployment policy
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          REF: ${{ inputs.ref }}
          CONFIRM: ${{ inputs.confirm }}
          EVENT: ${{ github.event_name }}
          ALLOW_DESTRUCTIVE: ${{ inputs.allow_destructive }}
          REDEPLOY_ALL: ${{ inputs.redeploy_all }}
        run: |
          set -euo pipefail
          echo "[step]     Check the deployment policy"
          echo "[info]     environment=${ENVIRONMENT} ref=${REF} trigger=${EVENT}"
          echo "[info]     allow_destructive=${ALLOW_DESTRUCTIVE} redeploy_all=${REDEPLOY_ALL}"
          case "$ENVIRONMENT" in
            dev|prod) echo "[decision] environment: '${ENVIRONMENT}' is allowed (dev | prod)" ;;
            *) echo "::error title=Policy::Unknown environment '$ENVIRONMENT'. Next: use dev or prod."; exit 1 ;;
          esac
          if [[ ! "$REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error title=Policy::The ref contains characters that are not allowed. Next: use a plain branch, tag or SHA."; exit 1
          fi
          echo "[decision] ref: only safe characters"
          if [[ "$ENVIRONMENT" == "prod" ]]; then
            if [[ "$EVENT" != "workflow_dispatch" ]]; then
              echo "::error title=Policy::prod is only deployed by a manual run of the Deploy workflow. Next: use Actions > Deploy > Run workflow."; exit 1
            fi
            if [[ "$CONFIRM" != "prod" ]]; then
              echo "::error title=Policy::To deploy prod, type prod in the 'confirm' input. Next: run the workflow again with confirm=prod."; exit 1
            fi
            if [[ ! "$REF" =~ ^release/[0-9]+\.[0-9]+(\.[0-9]+)?$ && ! "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error title=Policy::prod is only deployed from a release/<major.minor[.patch]> branch or a v<major.minor.patch> tag, not '$REF'. Next: pick the release branch."; exit 1
            fi
            echo "[decision] prod: manual run, confirmation typed, ref is a release ref"
          fi
          echo "[result]   policy passed"

  # ----------------------------------------------------------------------------
  # 1. Gate: is the environment provisioned? Reads variables only, no credentials
  # ----------------------------------------------------------------------------
  gate:
    name: Gate
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.env.outputs.ready }}
    steps:
      - name: Check the environment is provisioned
        id: env
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          echo "[step]     Check the environment is provisioned"
          echo "[info]     GitHub environment '${ENVIRONMENT}': project='${PROJECT_ID:-<not set>}' state bucket='${STATE_BUCKET:-<not set>}'"
          if [[ -z "$PROJECT_ID" || -z "$STATE_BUCKET" ]]; then
            if [[ "$ENVIRONMENT" == "prod" ]]; then
              echo "::error title=Gate::GitHub environment 'prod' has no GCP variables. Next: run ./scripts/recreate-environment.sh prod (docs/DEPLOYMENT.md)."
              exit 1
            fi
            echo "[decision] ready: no, '${ENVIRONMENT}' is not provisioned yet, so Verify, Plan and Apply are skipped"
            echo "::notice title=Gate::Environment '$ENVIRONMENT' is not provisioned yet; skipping. Run ./scripts/recreate-environment.sh $ENVIRONMENT."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "[decision] ready: yes, the environment has its GCP variables"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
          echo "[result]   ready=$(grep '^ready=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2)"

  # ----------------------------------------------------------------------------
  # 2. Verify: no cloud credentials are available to this job
  # ----------------------------------------------------------------------------
  verify:
    name: Verify
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Every later job checks out this exact commit, so what is verified is what is deployed,
      # even if the branch moves while a prod approval is pending.
      - name: Resolve the commit to deploy
        id: resolve
        env:
          REF: ${{ inputs.ref }}
        run: |
          sha="$(git rev-parse HEAD)"
          echo "[step]     Resolve the commit to deploy"
          echo "[result]   ${REF} -> ${sha}; every later job uses exactly this commit"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          echo "[step]     Install dependencies (frozen lockfiles: site and functions)"
          pnpm install --frozen-lockfile
          pnpm --prefix functions install --frozen-lockfile
          echo "[result]   dependencies installed"

      - name: Typecheck, lint and build the site
        run: |
          echo "[step]     Typecheck, lint and build the site"
          echo "[info]     typecheck"; npm run typecheck
          echo "[info]     lint";      npm run lint
          echo "[info]     build";     npm run build
          echo "[result]   site typechecks, lints and builds"

      - name: Build the Cloud Functions
        run: |
          echo "[step]     Build the Cloud Functions"
          pnpm --prefix functions run build
          echo "[result]   functions build"

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Validate Terraform
        working-directory: terraform
        run: |
          echo "[step]     Validate Terraform (no backend, no cloud access)"
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate
          echo "[result]   terraform is formatted and valid"

      - name: Deployment script checks
        run: bash scripts/check-scripts.sh

  # ----------------------------------------------------------------------------
  # 3. Plan: decide exactly what would change; nothing is applied here
  # ----------------------------------------------------------------------------
  plan:
    name: Plan
    needs: [gate, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      ENVIRONMENT: ${{ inputs.environment }}
      ALLOW_DESTRUCTIVE: ${{ inputs.allow_destructive }}
      REDEPLOY_ALL: ${{ inputs.redeploy_all }}
      SHA: ${{ needs.verify.outputs.sha }}
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
      plan_uri: ${{ steps.save.outputs.plan_uri }}
      components: ${{ steps.decide.outputs.components }}
      decision_md: ${{ steps.decide.outputs.decision_md }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform plan
        id: plan
        working-directory: terraform
        run: |
          set -euo pipefail
          source ../scripts/deploy/log.sh
          step_start "Terraform plan (nothing is applied in this job)"
          tfvars="environments/${ENVIRONMENT}.tfvars"
          info "project: ${PROJECT_ID}; state bucket: ${STATE_BUCKET}; var file: ${tfvars}; commit: ${SHA:0:7}"
          if [[ ! -f "$tfvars" ]]; then
            fail "terraform/$tfvars does not exist." "create it from dev.tfvars (docs/DEPLOYMENT.md)"
          fi
          terraform init -input=false -backend-config="bucket=${STATE_BUCKET}"
          set +e
          terraform plan -input=false -lock-timeout=5m -detailed-exitcode -no-color -out=tfplan -var-file="$tfvars"
          code=$?
          set -e
          case "$code" in
            0) echo "has_changes=false" >> "$GITHUB_OUTPUT"; decision "infrastructure" "no changes, Terraform will not be applied" ;;
            2) echo "has_changes=true" >> "$GITHUB_OUTPUT";  decision "infrastructure" "the plan has changes, listed in the summary" ;;
            *) fail "terraform plan failed (exit $code)." "read the error above; nothing was applied" ;;
          esac
          terraform show -json tfplan > plan.json
          terraform show -no-color tfplan > plan.txt
          changed_n="$(jq '[.resource_changes[]? | select(.change.actions != ["no-op"] and .change.actions != ["read"])] | length' plan.json)"
          result "${changed_n} resource(s) would change"
          {
            echo "## Plan for \`${ENVIRONMENT}\` at \`${SHA:0:7}\`"
            echo
            echo "Infrastructure resources that would change: **${changed_n}**"
            if [[ "$changed_n" != "0" ]]; then
              echo
              echo "| Action | Resource |"
              echo "|---|---|"
              jq -r '.resource_changes[]? | select(.change.actions != ["no-op"] and .change.actions != ["read"]) | "| \(.change.actions | join("+")) | `\(.address)` |"' plan.json
            fi
            echo
            echo "<details><summary>Full Terraform plan (sensitive values are redacted)</summary>"
            echo
            echo '```'
            head -c 60000 plan.txt
            echo '```'
            echo "</details>"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          step_end

      # Blocks the run before any approval or apply when a protected stateful resource would be
      # deleted or replaced. See docs/DEPLOYMENT.md "What the plan guard blocks".
      - name: Plan guard
        working-directory: terraform
        run: |
          set -euo pipefail
          source ../scripts/deploy/log.sh
          step_start "Plan guard (protected resources must not be deleted or replaced)"
          args=()
          if [[ "$ALLOW_DESTRUCTIVE" == "true" ]]; then
            args+=(--allow-destructive)
            decision "allow_destructive" "set on purpose for this run, deletes and replaces are allowed"
          else
            decision "allow_destructive" "not set, a delete or replace of a protected resource fails this run"
          fi
          python3 -I ../scripts/deploy/plan_guard.py plan.json "${args[@]}" --summary "$GITHUB_STEP_SUMMARY"
          result "plan guard passed"
          step_end

      # Reads the last deployed hash of each component and compares it to the sources of this
      # commit. The result is the table the prod approver sees and the only list Apply deploys.
      - name: Decide what to deploy
        id: decide
        env:
          HAS_CHANGES: ${{ steps.plan.outputs.has_changes }}
        run: |
          set -euo pipefail
          source scripts/deploy/log.sh
          step_start "Decide what to deploy"
          info "commit: ${SHA}"
          info "redeploy_all: ${REDEPLOY_ALL}"
          list=()
          rows=""
          for c in functions rules apphosting; do
            IFS=$'\t' read -r changed current previous reason < <(bash scripts/deploy/components.sh status "$c" "$STATE_BUCKET")
            if [[ "$REDEPLOY_ALL" == "true" ]]; then changed=true; reason="redeploy_all is set"; fi
            info "$c: source ${current:0:12}, last deployed ${previous:0:12}"
            if [[ "$changed" == "true" ]]; then
              decision "$c" "WILL DEPLOY: ${reason}"
              list+=("$c"); action="deploy"
            else
              decision "$c" "unchanged, will not be touched (${reason})"
              action="not touched"
            fi
            rows+="| ${c} | \`${previous:0:12}\` | \`${current:0:12}\` | ${action} | ${reason} |"$'\n'
          done
          infra="no changes, not touched"
          if [[ "$HAS_CHANGES" == "true" ]]; then infra="apply the reviewed plan"; fi
          decision "infrastructure (Terraform)" "$infra"
          csv="$(IFS=','; echo "${list[*]:-}")"
          table="### What this run will change on \`${ENVIRONMENT}\`"$'\n\n'"| Part | Last deployed | This commit | Action | Reason |"$'\n'"|---|---|---|---|---|"$'\n'"| infrastructure (Terraform) | | | ${infra} | see the plan above |"$'\n'"${rows}"
          printf '%s\n' "$table" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "components=${csv}"
            echo "decision_md<<DECISION_EOF"
            printf '%s\n' "$table"
            echo "DECISION_EOF"
          } >> "$GITHUB_OUTPUT"
          result "components to deploy: ${csv:-none}"
          step_end

      # The saved plan can contain values Terraform does not redact in JSON, so it goes to the
      # environment's private state bucket, not to a GitHub artifact.
      - name: Save the plan privately
        id: save
        working-directory: terraform
        run: |
          set -euo pipefail
          source ../scripts/deploy/log.sh
          step_start "Save the plan privately"
          uri="gs://${STATE_BUCKET}/deploy/plans/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/tfplan"
          info "destination: ${uri} (the state bucket is private; plans expire after 7 days)"
          gcloud storage cp tfplan "$uri"
          echo "plan_uri=${uri}" >> "$GITHUB_OUTPUT"
          result "plan saved"
          step_end

  # ----------------------------------------------------------------------------
  # 4. Approve (prod only): reviewers of the `prod-release` GitHub environment must approve
  # ----------------------------------------------------------------------------
  approve:
    name: Approve prod
    if: inputs.environment == 'prod' && needs.plan.result == 'success'
    needs: [verify, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: prod-release
    permissions: {}
    steps:
      - name: Approved
        env:
          SHA: ${{ needs.verify.outputs.sha }}
          REF: ${{ inputs.ref }}
          HAS_CHANGES: ${{ needs.plan.outputs.has_changes }}
          COMPONENTS: ${{ needs.plan.outputs.components }}
          DECISION_MD: ${{ needs.plan.outputs.decision_md }}
        run: |
          echo "[step]     Approval for prod"
          echo "[info]     ref ${REF} at commit ${SHA}"
          echo "[info]     infrastructure changes in the reviewed plan: ${HAS_CHANGES}"
          echo "[info]     components that will deploy: ${COMPONENTS:-none}"
          printf '%s\n' "$DECISION_MD" >> "$GITHUB_STEP_SUMMARY"
          echo "[result]   approved by a prod-release reviewer; Apply uses exactly this plan and this table"

  # ----------------------------------------------------------------------------
  # 5. Apply: only the reviewed plan, only the components marked changed
  # ----------------------------------------------------------------------------
  apply:
    name: Apply
    needs: [verify, plan, approve]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.approve.result == 'success' || needs.approve.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      ENVIRONMENT: ${{ inputs.environment }}
      ALLOW_DESTRUCTIVE: ${{ inputs.allow_destructive }}
      SHA: ${{ needs.verify.outputs.sha }}
      HAS_CHANGES: ${{ needs.plan.outputs.has_changes }}
      PLAN_URI: ${{ needs.plan.outputs.plan_uri }}
      COMPONENTS: ${{ needs.plan.outputs.components }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Terraform init
        id: init
        working-directory: terraform
        run: |
          set -euo pipefail
          source ../scripts/deploy/log.sh
          step_start "Terraform init"
          info "state bucket: ${STATE_BUCKET}"
          terraform init -input=false -backend-config="bucket=${STATE_BUCKET}"
          cms_bucket="$(terraform output -raw default_storage_bucket 2>/dev/null || true)"
          echo "cms_bucket=${cms_bucket:-${PROJECT_ID}.firebasestorage.app}" >> "$GITHUB_OUTPUT"
          result "CMS bucket: ${cms_bucket:-${PROJECT_ID}.firebasestorage.app}"
          step_end

      # Only ever turns protection ON (versioning etc.); never changes or deletes objects.
      - name: Protect buckets (versioning)
        env:
          CMS_BUCKET: ${{ steps.init.outputs.cms_bucket }}
        run: bash scripts/deploy/harden-buckets.sh "$STATE_BUCKET" "$CMS_BUCKET"

      # A run with nothing to change takes no snapshot, so no-op runs write nothing.
      - name: Snapshot the CMS files
        id: backup
        env:
          CMS_BUCKET: ${{ steps.init.outputs.cms_bucket }}
        run: |
          set -euo pipefail
          source scripts/deploy/log.sh
          if [[ "$HAS_CHANGES" != "true" && -z "$COMPONENTS" ]]; then
            step_start "Snapshot the CMS files"
            decision "snapshot" "skipped: no infrastructure changes and no component will deploy, nothing is at risk"
            result "no backup taken"
            step_end
            exit 0
          fi
          out="$(bash scripts/deploy/backup-snapshot.sh "$STATE_BUCKET" "$CMS_BUCKET" "$SHA")"
          echo "backup=$(echo "$out" | sed -n 's/^backup=//p' | tail -n 1)" >> "$GITHUB_OUTPUT"

      # Applies the exact plan that was reviewed (and approved for prod). Terraform refuses a
      # saved plan whose state changed since it was made, so nothing unreviewed can sneak in.
      - name: Terraform apply (saved plan)
        id: tfapply
        working-directory: terraform
        run: |
          set -euo pipefail
          source ../scripts/deploy/log.sh
          step_start "Terraform apply (saved plan)"
          if [[ "$HAS_CHANGES" != "true" ]]; then
            decision "apply" "skipped: the plan had no changes"
            result "infrastructure not touched"
            step_end
            exit 0
          fi
          info "plan: ${PLAN_URI}"
          decision "apply" "applying exactly the plan that was reviewed; no re-plan"
          gcloud storage cp "$PLAN_URI" tfplan
          terraform apply -input=false -lock-timeout=5m -no-color tfplan
          result "reviewed plan applied"
          step_end

      # Deploys ONLY the components the Plan job marked changed. Anything unchanged is not
      # touched at all. No --force unless allow_destructive is set, so the CLI refuses to
      # delete functions.
      - name: Deploy changed components
        run: |
          set -euo pipefail
          source scripts/deploy/log.sh
          if [[ -z "$COMPONENTS" ]]; then
            step_start "Deploy changed components"
            decision "deploy" "skipped: functions, rules and App Hosting are all unchanged"
            result "nothing deployed"
            step_end
            exit 0
          fi
          step_start "Install the Firebase CLI"
          info "firebase-tools@${FIREBASE_TOOLS_VERSION}"
          npm install --global "firebase-tools@${FIREBASE_TOOLS_VERSION}"
          step_end
          args=(--components "$COMPONENTS")
          if [[ "$ALLOW_DESTRUCTIVE" == "true" ]]; then args+=(--allow-destructive); fi
          bash scripts/deploy-backend.sh "$PROJECT_ID" "${args[@]}"

      # Recorded only after a successful deploy, so a failed deploy is retried by the next run.
      - name: Record what was deployed
        run: |
          set -euo pipefail
          source scripts/deploy/log.sh
          step_start "Record what was deployed"
          if [[ -z "$COMPONENTS" ]]; then
            decision "record" "skipped: nothing was deployed"
            step_end
            exit 0
          fi
          IFS=',' read -ra items <<< "$COMPONENTS"
          for c in "${items[@]}"; do
            bash scripts/deploy/components.sh record "$c" "$STATE_BUCKET" "$SHA" "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          done
          step_end

      - name: Smoke test
        working-directory: terraform
        run: |
          set -euo pipefail
          url="$(terraform output -raw apphosting_url)"
          bash ../scripts/deploy/smoke-test.sh "$url"

      - name: Summary
        if: always()
        env:
          BACKUP: ${{ steps.backup.outputs.backup }}
          DECISION_MD: ${{ needs.plan.outputs.decision_md }}
          REF: ${{ inputs.ref }}
        run: |
          {
            echo "## Deployment of \`${REF}\` to \`${ENVIRONMENT}\`"
            echo
            echo "Commit: \`${SHA}\`"
            echo
            printf '%s\n' "$DECISION_MD"
            echo
            echo "| Other | Result |"
            echo "|---|---|"
            echo "| CMS file backup | ${BACKUP:-none taken (nothing to protect or nothing to back up)} |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
