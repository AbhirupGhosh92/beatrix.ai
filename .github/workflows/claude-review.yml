name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs do not receive secrets, so skip them (and drafts).
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CLAUDE.md first for project conventions
            (React 19, TypeScript strict flags, Tailwind v4 + daisyUI, all copy in
            src/data/profile.json / profile.example.json).

            Focus on, in order:
            1. Correctness bugs and regressions.
            2. Security: committed secrets, personal data (emails, phone numbers,
               resumes, profile.json), unsafe HTML or dependency changes.
            3. Accessibility, responsiveness and light/dark theme contrast.
            4. Hardcoded text in components that should live in the profile JSON.
            5. Unused code or unnecessary files.

            Be concise. Post inline comments on specific lines with
            mcp__github_inline_comment__create_inline_comment, and one short
            summary comment with `gh pr comment`. Do not nitpick formatting that
            ESLint already enforces.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
