# Firebase App Hosting config. Safe to commit: it names secrets, never holds values.
#
runConfig:
  minInstances: 0
  maxInstances: 1

# The site calls the Cloud Functions in functions/ (deployed separately with
# `firebase deploy --only functions`, or by .github/workflows/deploy-functions.yml). The only
# server-side setting it needs is the Firebase project id, which App Hosting provides as
# GOOGLE_CLOUD_PROJECT (or set NEXT_PUBLIC_FIREBASE_PROJECT_ID in the backend's environment).
