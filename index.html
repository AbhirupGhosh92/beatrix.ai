<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;500;600;700&family=Fredoka:wght@400;500;600&family=Quicksand:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved (else system) theme before first paint; ThemeToggle
      // removes this attribute on mount. Keep in sync with ThemeToggle.tsx.
      try {
        var t = localStorage.getItem('theme')
        if (t !== 'beatrix-dark' && t !== 'beatrix-light') {
          t = matchMedia('(prefers-color-scheme: dark)').matches
            ? 'beatrix-dark'
            : 'beatrix-light'
        }
        document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
    <title>beatrix.ai</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
