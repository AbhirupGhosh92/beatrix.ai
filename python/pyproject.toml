[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beatrix-ai-service"
version = "0.1.0"
description = "Private Python service for LangChain and other AI code (Cloud Run)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[tool.setuptools]
packages = ["app"]
